name: Publish Daily Summary

# 只允許排程與手動觸發，不接受任何形式的外部 PR 觸發，
# 也不會 checkout 或執行來自 Fork 的程式碼（沒有 pull_request / pull_request_target 觸發）。
on:
  schedule:
    # 23:07 UTC = 07:07 Asia/Taipei（原本是 00:00 UTC / 08:00 Asia/Taipei，提前約 1 小時）。
    # 刻意不排在整點（例如 23:00 UTC），因為 00:00 UTC 是全球排程最壅塞的時間點，
    # GitHub 官方文件也建議避開整點以降低延遲或被跳過的機率
    # （2026-07-25 就發生過整點排程過了一個多小時仍未觸發的狀況）。
    # 最後一次分析時段標記為「24:00」（節目表式記法，代表前一天最後一次），
    # 實際觸發時刻是當天 00:00 Asia/Taipei。
    # 2026-07-26 變更：GitHub Pages 的部署已經改成由本 workflow 的
    # deploy_pages job 呼叫（見下方 jobs），不再依賴 site/** push 自動觸發，
    # 也不需要再靠時間間隔去「賭」Pages 有沒有部署完成——新文章一定會在這次
    # 執行時才部署上線，跟 Telegram 通知同時發生。
    - cron: "7 23 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "選填：要補發的日期（Asia/Taipei，格式 YYYY-MM-DD）。留空則預設為「前一天」"
        required: false
        type: string

# 這裡列出的是本 workflow 所有 job 加總需要的權限上限；下方每個 job 會再用
# job 層級的 permissions 收斂回自己實際需要的最小範圍。
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-summary-publish
  cancel-in-progress: false

jobs:
  deploy_pages:
    name: Deploy latest content to GitHub Pages
    # 呼叫 deploy-pages.yml（reusable workflow）。這一步會把目前 main 分支上
    # 已經存在的 site/** 內容（包含 24:00 排程稍早 push 的新文章）建置並部署
    # 上線；下面 publish job 要等這個 job 成功後才會送出 Telegram，確保通知
    # 送出時網站已經是最新版本。
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  publish:
    name: Validate, notify, and mark published
    needs: deploy_pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve target date (Asia/Taipei)
        id: resolve_date
        env:
          MANUAL_DATE: ${{ inputs.date }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          import os
          from zoneinfo import ZoneInfo

          manual = os.environ.get("MANUAL_DATE", "").strip()
          if manual:
              # 手動補發：直接使用使用者指定的日期。
              date_str = manual
          else:
              # 排程自動執行：正式發布的是「前一天」的每日摘要
              # （因為最後分析時段 24:00 實際觸發於當天 00:00，發布排程在
              #   隔天 07:07 執行，兩者相隔約 7 小時）。
              taipei_now = datetime.datetime.now(ZoneInfo("Asia/Taipei"))
              target = taipei_now.date() - datetime.timedelta(days=1)
              date_str = target.strftime("%Y-%m-%d")
          print(f"date={date_str}")
          PY

      - name: Check if already published
        id: check_published
        run: |
          if [ -f ".state/published/${{ steps.resolve_date.outputs.date }}" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice (already published)
        if: steps.check_published.outputs.already == 'true'
        run: |
          echo "${{ steps.resolve_date.outputs.date }} 已經發布過，略過本次發布（不會重複傳送 Telegram）。"

      - name: Validate report and summary
        if: steps.check_published.outputs.already == 'false'
        run: |
          python scripts/validate_report.py --date "${{ steps.resolve_date.outputs.date }}"

      - name: Extract Telegram-ready summary
        if: steps.check_published.outputs.already == 'false'
        id: extract
        run: |
          mkdir -p "$RUNNER_TEMP/telegram"
          python scripts/extract_summary.py \
            --date "${{ steps.resolve_date.outputs.date }}" \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --output-dir "$RUNNER_TEMP/telegram"
          echo "manifest=$RUNNER_TEMP/telegram/manifest.json" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        if: steps.check_published.outputs.already == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_telegram.py --manifest "${{ steps.extract.outputs.manifest }}"

      - name: Mark date as published
        if: steps.check_published.outputs.already == 'false'
        run: |
          python scripts/mark_published.py \
            --date "${{ steps.resolve_date.outputs.date }}" \
            --run-id "${{ github.run_id }}"

      - name: Commit and push published state
        if: steps.check_published.outputs.already == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ".state/published/${{ steps.resolve_date.outputs.date }}"
          git commit -m "chore: mark ${{ steps.resolve_date.outputs.date }} summary as published"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
