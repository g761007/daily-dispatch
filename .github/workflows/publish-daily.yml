name: Publish Daily Summary

# 只允許手動與「發布觸發檔 push」兩種方式觸發，不接受任何形式的外部 PR 觸發，
# 也不會 checkout 或執行來自 Fork 的程式碼（沒有 pull_request / pull_request_target 觸發）。
#
# 2026-08 變更：移除原本的 GitHub 原生 `schedule` cron。GitHub Actions 的
# schedule 觸發長期不穩定（延遲超過一小時、甚至整次被跳過，見 2026-07-25/26
# 的實際觀察）。正式發布的「排程」職責已經全部改由 Claude Code 雲端排程
# （routine「📤 每日發布觸發（07:07）」）負責：該 routine 每天 Asia/Taipei
# 07:07 在雲端更新並 push `.github/publish-trigger`，藉由下方 push 觸發本
# workflow。手動補發仍可用 workflow_dispatch。
#
# 「24:00」是節目表式記法（代表前一天最後一次分析），實際觸發時刻是當天
# 00:00 Asia/Taipei；發布 routine 固定在隔天 07:07 執行、對應「前一天」的摘要。
# GitHub Pages 的部署由本 workflow 的 deploy_pages job 呼叫（見下方 jobs），
# 新文章一定在這次執行才部署上線，跟 Telegram 通知同時發生。
on:
  workflow_dispatch:
    inputs:
      date:
        description: "選填：要補發的日期（Asia/Taipei，格式 YYYY-MM-DD）。留空則預設為「前一天」"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      # 正式發布的唯一自動觸發來源：Claude Code 雲端排程 routine 每天 07:07
      # （Asia/Taipei）在雲端 push 這個檔案來觸發本 workflow。正常內容排程
      # （reports/**、site/**）不會觸發這裡，只有這個檔案有變更才會。
      # 是否已經發布過、要不要重複發送 Telegram，交給下面 publish job 自己的
      # 「已發布狀態檔」機制與本 workflow 的 concurrency 設定判斷，這裡不需要
      # 額外處理。
      - ".github/publish-trigger"

# 這裡列出的是本 workflow 所有 job 加總需要的權限上限；下方每個 job 會再用
# job 層級的 permissions 收斂回自己實際需要的最小範圍。
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-summary-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Resolve date and validate report/summary format
    # 2026-07-26 曾發生：來源連結格式（[標題 | 來源](網址)）裡有未跳脫的 |，
    # 被 kramdown 的 GFM 表格解析誤判成表格分隔符，導致連結顯示錯誤，且這個
    # 問題是在網站已經部署上線之後才被發現。原本的驗證步驟（validate_report.py）
    # 是排在 deploy_pages 之後執行，只能擋住 Telegram 通知與「標記已發布」，
    # 擋不住錯誤內容已經部署上線這件事。
    # 因此把驗證獨立成最先執行的 job：deploy_pages 現在 `needs: validate`，
    # 只要這個 job 失敗（包含 validate_report.py 偵測到格式問題時），
    # deploy_pages 與後面的 publish job都會被 GitHub Actions 自動跳過，
    # 網站不會部署到有問題的內容，也不會送出對應的 Telegram 通知。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      date: ${{ steps.resolve_date.outputs.date }}
      already: ${{ steps.check_published.outputs.already }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve target date (Asia/Taipei)
        id: resolve_date
        env:
          MANUAL_DATE: ${{ inputs.date }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime
          import os
          from zoneinfo import ZoneInfo

          manual = os.environ.get("MANUAL_DATE", "").strip()
          if manual:
              # 手動補發：直接使用使用者指定的日期。
              date_str = manual
          else:
              # 排程自動執行：正式發布的是「前一天」的每日摘要
              # （因為最後分析時段 24:00 實際觸發於當天 00:00，發布排程在
              #   隔天 07:07 執行，兩者相隔約 7 小時）。
              taipei_now = datetime.datetime.now(ZoneInfo("Asia/Taipei"))
              target = taipei_now.date() - datetime.timedelta(days=1)
              date_str = target.strftime("%Y-%m-%d")
          print(f"date={date_str}")
          PY

      - name: Check if already published
        id: check_published
        run: |
          if [ -f ".state/published/${{ steps.resolve_date.outputs.date }}" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate report and summary
        if: steps.check_published.outputs.already == 'false'
        run: |
          python scripts/validate_report.py --date "${{ steps.resolve_date.outputs.date }}"

      - name: Skip notice (already published)
        if: steps.check_published.outputs.already == 'true'
        run: |
          echo "${{ steps.resolve_date.outputs.date }} 已經發布過，略過格式驗證（不會重複部署或傳送 Telegram）。"

  deploy_pages:
    name: Deploy latest content to GitHub Pages
    needs: validate
    # 呼叫 deploy-pages.yml（reusable workflow）。這一步會把目前 main 分支上
    # 已經存在的 site/** 內容（包含 24:00 排程稍早 push 的新文章）建置並部署
    # 上線；下面 publish job 要等這個 job 成功後才會送出 Telegram，確保通知
    # 送出時網站已經是最新版本。needs: validate 確保只有格式驗證通過（或當天
    # 已經發布過、不需要重新驗證）才會真的部署。
    uses: ./.github/workflows/deploy-pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  publish:
    name: Notify and mark published
    needs: [validate, deploy_pages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: pip install -r scripts/requirements.txt

      - name: Skip notice (already published)
        if: needs.validate.outputs.already == 'true'
        run: |
          echo "${{ needs.validate.outputs.date }} 已經發布過，略過本次發布（不會重複傳送 Telegram）。"

      - name: Extract Telegram-ready summary
        if: needs.validate.outputs.already == 'false'
        id: extract
        run: |
          mkdir -p "$RUNNER_TEMP/telegram"
          python scripts/extract_summary.py \
            --date "${{ needs.validate.outputs.date }}" \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --output-dir "$RUNNER_TEMP/telegram"
          echo "manifest=$RUNNER_TEMP/telegram/manifest.json" >> "$GITHUB_OUTPUT"

      - name: Send Telegram notification
        if: needs.validate.outputs.already == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_telegram.py --manifest "${{ steps.extract.outputs.manifest }}"

      - name: Mark date as published
        if: needs.validate.outputs.already == 'false'
        run: |
          python scripts/mark_published.py \
            --date "${{ needs.validate.outputs.date }}" \
            --run-id "${{ github.run_id }}"

      - name: Commit and push published state
        if: needs.validate.outputs.already == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ".state/published/${{ needs.validate.outputs.date }}"
          git commit -m "chore: mark ${{ needs.validate.outputs.date }} summary as published"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
