name: Deploy GitHub Pages

# 2026-07-26 變更：不再由 push 觸發。之前「site/** 有變更就自動部署」會讓新
# 文章在 Cowork 24:00 排程 push 後就立刻上線，比 Telegram 正式發布通知早了
# 好幾個小時曝光。現在改成只接受手動觸發（測試用），或被 publish-daily.yml
# 以 workflow_call 方式呼叫（正式發布時），確保新文章只在正式發布的那一刻
# 才出現在網站上，跟 Telegram 通知同時發生。
# 不包含 pull_request / pull_request_target，不會執行外部 PR 的程式碼，
# 也完全不會用到 Telegram 相關 Secrets（見 README「安全注意事項」）。
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
